<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 鱼缸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #081018;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #app canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 10;
      color: #cfe6f2;
      font: 12px/1.8 "Microsoft YaHei", system-ui, sans-serif;
      background: rgba(6, 16, 26, 0.55);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(120, 190, 230, 0.25);
      user-select: none;
      min-width: 176px;
    }

    #hud .row {
      display: flex;
      justify-content: space-between;
      gap: 18px;
    }

    #hud .label {
      color: #7fa8c0;
    }

    #hud .val {
      font-weight: 600;
      color: #9fe8ff;
    }

    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: rgba(200, 225, 240, 0.55);
      font: 12px/1.6 "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
      pointer-events: none;
      background: rgba(6, 16, 26, 0.35);
      padding: 6px 14px;
      border-radius: 20px;
    }

    #panel {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 10;
      color: #cfe6f2;
      font: 12px/1.8 "Microsoft YaHei", system-ui, sans-serif;
      background: rgba(6, 16, 26, 0.55);
      backdrop-filter: blur(6px);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(120, 190, 230, 0.25);
      user-select: none;
      width: 230px;
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    #panel .ptitle {
      font-weight: 600;
      color: #9fe8ff;
      margin-bottom: 4px;
    }

    #panel .prow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }

    #panel .prow span:first-child {
      width: 74px;
      color: #7fa8c0;
      flex-shrink: 0;
    }

    #panel .prow input {
      flex: 1;
      min-width: 0;
      accent-color: #4fc3f7;
    }

    #panel .pval {
      width: 42px;
      text-align: right;
      color: #9fe8ff;
      font-weight: 600;
    }

    /* 移动端展示：隐藏键盘操作提示，精简 HUD */
    @media (max-width: 768px) {
      #hint {
        display: none;
      }

      #hud {
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        font-size: 11px;
        min-width: 128px;
      }
    }

    /* 竖屏提示：引导旋转至横屏（横屏自动消失） */
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 12, 20, 0.85);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #9fe8ff;
      font: 16px/1.6 "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
      user-select: none;
    }

    #rotate-hint .icon {
      font-size: 46px;
      animation: rotate-pulse 1.6s ease-in-out infinite;
    }

    #rotate-hint .sub {
      color: rgba(159, 232, 255, 0.6);
      font-size: 13px;
    }

    @keyframes rotate-pulse {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(90deg);
      }
    }

    @media (orientation: portrait) {
      body.mobile #rotate-hint {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="hud">
    <div class="row"><span class="label">渲染 API</span><span class="val" id="api">检测中…</span></div>
    <div class="row"><span class="label">FPS</span><span class="val" id="fps">-</span></div>
    <div class="row"><span class="label">分辨率</span><span class="val" id="res">-</span></div>
    <div class="row"><span class="label">视角</span><span class="val" id="mode">环绕</span></div>
    <div class="row"><span class="label">状态</span><span class="val" id="state">运行</span></div>
  </div>
  <div id="hint">右键旋转 · 中键平移 · 滚轮缩放 · WASD 移动 · 空格 暂停 · F 追尾视角 · Tab 切换鱼 · 点击撒食 · P 截图</div>
  <div id="rotate-hint">
    <div class="icon">↻</div>
    <div>请将手机旋转至横屏</div>
    <div class="sub">横屏可获得最佳观赏体验</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
